name: Clean up integrated Ovren branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  prune:
    if: github.repository == 'lylicht/ovren'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only merged or superseded task branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # PR #3 is the older logo implementation superseded by merged PR #4.
          # PRs #4 and #5 may only be pruned after their own merge.
          while IFS='|' read -r number branch policy; do
            state="$(gh api "repos/$GH_REPO/pulls/$number" --jq '.state')"
            merged="$(gh api "repos/$GH_REPO/pulls/$number" --jq '.merged')"
            if [[ "$policy" == merged && "$merged" != true ]]; then
              echo "Keeping $branch: PR #$number has not merged."
              continue
            fi
            if [[ "$policy" == superseded && ( "$state" != closed || "$merged" == true ) ]]; then
              echo "Keeping $branch: PR #$number has not been closed as superseded."
              continue
            fi
            expected="$(gh api "repos/$GH_REPO/pulls/$number" --jq '.head.sha')"
            current="$(gh api "repos/$GH_REPO/branches/$branch" --jq '.commit.sha' 2>/dev/null || true)"
            if [[ -z "$current" ]]; then
              echo "Already deleted: $branch."
              continue
            fi
            if [[ "$current" != "$expected" ]]; then
              echo "Keeping $branch: branch has changed since PR #$number."
              continue
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Deleted: $branch"
          done <<'BRANCHES'
          3|chore/desktop-orbital-icons|superseded
          4|feat/official-orbital-desktop-icon|merged
          5|feat/native-file-explorer|merged
          BRANCHES
      - name: Cancel superseded Explorer CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/native-file-explorer
          current="$(gh api "repos/$GH_REPO/branches/$branch" --jq '.commit.sha' 2>/dev/null || true)"
          if [[ -z "$current" ]]; then
            echo "Explorer task branch already removed."
            exit 0
          fi
          gh api "repos/$GH_REPO/actions/runs?branch=$branch&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "Cross-platform builds" and (.status == "in_progress" or .status == "queued")) | [.id, .head_sha] | @tsv' |
            while read -r run sha; do
              if [[ "$sha" == "$current" ]]; then
                echo "Keeping current CI run $run."
                continue
              fi
              gh api --method POST "repos/$GH_REPO/actions/runs/$run/cancel" >/dev/null 2>&1 || true
              echo "Requested cancellation of obsolete CI run $run."
            done
