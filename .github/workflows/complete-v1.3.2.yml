name: Complete validated Ovren v1.3.2 release

# One-time, SHA-pinned handoff. Do not merge or publish a failed CI run.
on:
  workflow_run:
    workflows: ["Cross-platform builds"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ovren-v1.3.2-release-gate
  cancel-in-progress: false

jobs:
  integrate-explorer:
    if: >-
      github.repository == 'lylicht/ovren' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == 'lylicht/ovren' &&
      github.event.workflow_run.head_branch == 'feat/native-file-explorer' &&
      github.event.workflow_run.head_sha == 'bbfa562d9681049216b2268d6fb0c3dd85a3e131' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_HEAD: bbfa562d9681049216b2268d6fb0c3dd85a3e131
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge the exact CI-validated Explorer commit
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$GH_REPO/pulls/5" --jq '.merged')"
          head="$(gh api "repos/$GH_REPO/pulls/5" --jq '.head.sha')"
          if [[ "$head" != "$EXPECTED_HEAD" ]]; then
            echo "PR head has moved; refusing to merge an unvalidated commit." >&2
            exit 1
          fi
          if [[ "$merged" != true ]]; then
            gh api --method PUT "repos/$GH_REPO/pulls/5/merge" \
              -f merge_method=squash \
              -f sha="$EXPECTED_HEAD" \
              -f commit_title="feat(files): integrate native Ovren Explorer (#5)"
          fi
          merged="$(gh api "repos/$GH_REPO/pulls/5" --jq '.merged')"
          [[ "$merged" == true ]] || { echo "Explorer PR was not merged." >&2; exit 1; }
          branch_head="$(gh api "repos/$GH_REPO/branches/feat/native-file-explorer" --jq '.commit.sha' 2>/dev/null || true)"
          if [[ "$branch_head" == "$EXPECTED_HEAD" ]]; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/feat/native-file-explorer"
          fi
      - name: Prepare v1.3.2 metadata on main after successful merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const read = (path) => readFileSync(path, 'utf8');
          const update = (path, before, after) => {
            const source = read(path);
            const count = source.split(before).length - 1;
            if (count !== 1) {
              throw new Error(path + ': expected one version marker, found ' + count);
            }
            writeFileSync(path, source.replace(before, after));
          };

          const currentVersion = JSON.parse(read('package.json')).version;
          if (currentVersion === '1.3.2') {
            console.log('Ovren v1.3.2 metadata already prepared.');
            process.exit(0);
          }
          if (currentVersion !== '1.3.0') {
            throw new Error('Unexpected release base: ' + currentVersion);
          }

          update('package.json', '"version": "1.3.0"', '"version": "1.3.2"');
          update('app/package.json', '"version": "1.3.0"', '"version": "1.3.2"');
          update('app/src-tauri/tauri.conf.json', '"version": "1.3.0"', '"version": "1.3.2"');
          update('app/Cargo.toml', 'version = "1.3.0"', 'version = "1.3.2"');
          for (const name of [
            'mangodisk', 'mangodisk-cli', 'mangodisk-core', 'mangodisk-platform',
            'mangodisk-privileged', 'mangodisk-privileged-protocol'
          ]) {
            update(
              'app/Cargo.lock',
              '[[package]]\nname = "' + name + '"\nversion = "1.3.0"',
              '[[package]]\nname = "' + name + '"\nversion = "1.3.2"'
            );
          }
          update('README.md', 'Made by Licht · Version 1.3.0', 'Made by Licht · Version 1.3.2');
          const changelog = read('CHANGELOG.md');
          const header = '# Changelog\n\n';
          if (!changelog.startsWith(header)) throw new Error('Unexpected changelog header.');
          const release = [
            '## 1.3.2 — 2026-11-20',
            '',
            '- Adopted the official orbital desktop icon across Windows, macOS, and Linux, including installers and native tray artwork.',
            '- Expanded the file browser into an Ovren-styled native file explorer with navigation history, virtualized details/grid views, selection, search, and keyboard shortcuts.',
            '- Added native Rust create, rename, copy, move, and Trash operations with no-overwrite safety and staged copies.',
            '- Connected the explorer to storage analysis, large-file discovery, and duplicate-file tools.',
            '- Added localization and focused filesystem regression tests.',
            '',
          ].join('\n');
          writeFileSync('CHANGELOG.md', header + release + changelog.slice(header.length));
          NODE
          if git diff --quiet; then
            echo "Version already current; no duplicate CI run necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json app/package.json app/src-tauri/tauri.conf.json app/Cargo.toml app/Cargo.lock README.md CHANGELOG.md
          git commit -m "release: prepare Ovren v1.3.2"
          git push origin main
          # GITHUB_TOKEN pushes do not trigger normal push workflows. A workflow
          # dispatch is explicitly allowed, and tests the exact updated main.
          gh workflow run cross-platform-builds.yml --repo "$GH_REPO" --ref main

  release-after-main-checks:
    if: >-
      github.repository == 'lylicht/ovren' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PASSED_HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch signed release only for the checked main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          [[ "$current" == "$PASSED_HEAD" ]] || {
            echo "main moved after CI; not publishing an unchecked commit."
            exit 0
          }
          version="$(node -p "require('./package.json').version")"
          [[ "$version" == "1.3.2" ]] || {
            echo "Not the v1.3.2 release candidate."
            exit 0
          }
          merged="$(gh api "repos/$GH_REPO/pulls/5" --jq '.merged')"
          [[ "$merged" == true ]] || { echo "Explorer PR is not merged." >&2; exit 1; }
          if gh api "repos/$GH_REPO/releases/tags/v1.3.2" >/dev/null 2>&1; then
            echo "v1.3.2 was already published; nothing to repeat."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.2 >/dev/null 2>&1; then
            echo "Release tag exists but release is absent; manual inspection required." >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin refs/heads/release/v1.3.2 >/dev/null 2>&1; then
            echo "Release build branch already exists; avoiding duplicate dispatch."
            exit 0
          fi
          git push origin "$current:refs/heads/release/v1.3.2"
          # Dispatching via GITHUB_TOKEN is explicitly supported by GitHub and
          # does trigger the normal release workflow. It will publish only after
          # Windows, Linux and macOS signing/build steps pass.
          gh workflow run release.yml --repo "$GH_REPO" --ref release/v1.3.2
