name: Regenerate Ovren desktop icon assets (temporary)

on:
  push:
    branches:
      - chore/desktop-orbital-icons

permissions:
  contents: write

jobs:
  regenerate-icons:
    if: ${{ !contains(github.event.head_commit.message, '[icons-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install icon build tools
        run: pnpm --dir app install --frozen-lockfile
      - name: Generate official desktop icon binaries
        run: node app/scripts/generate-resident-icons.mjs
      - name: Commit generated icons to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src-tauri/icons
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate official desktop icon binaries [icons-generated]'
            git push origin HEAD:chore/desktop-orbital-icons
          fi
