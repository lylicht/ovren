name: Build and publish Ovren

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    outputs:
      release_tag: ${{ steps.release_version.outputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test release metadata validation
        run: node --test scripts/test-release-preflight.cjs
      - name: Validate release tag, app versions, and changelog
        id: release_version
        run: node scripts/release-preflight.mjs "${GITHUB_REF_NAME#release/}"

  windows:
    needs: [preflight]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: app
          cache-workspaces: app -> target
          cache-key: windows-latest
      - name: Install the existing Windows signing certificate
        id: windows-signing
        timeout-minutes: 5
        env:
          WYRE_WINDOWS_PFX: ${{ secrets.WYRE_WINDOWS_PFX }}
          WYRE_WINDOWS_PFX_PASSWORD: ${{ secrets.WYRE_WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WYRE_WINDOWS_PFX -or -not $env:WYRE_WINDOWS_PFX_PASSWORD) { throw 'Set WYRE_WINDOWS_PFX and WYRE_WINDOWS_PFX_PASSWORD in repository Actions secrets.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ovren-signing.pfx'
          Write-Output 'Decoding Windows signing certificate.'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WYRE_WINDOWS_PFX))
          $password = ConvertTo-SecureString $env:WYRE_WINDOWS_PFX_PASSWORD -AsPlainText -Force
          Write-Output 'Importing Windows signing certificate and private key.'
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Confirm:$false -ErrorAction Stop
          Remove-Item $pfxPath
          if (-not $certificate -or $certificate.Subject -notmatch 'CN=bxane') { throw 'The configured Windows certificate must identify bxane.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ovren-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $certificatePath -Force | Out-Null
          Write-Output 'Trusting Windows signing certificate for signature verification.'
          certutil.exe -f -addstore Root $certificatePath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not add the signing certificate to the root store.' }
          Write-Output 'Windows signing certificate trust import complete.'
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/ovrennet/go.mod
      - name: Build Ovren installer
        working-directory: app
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          WYRE_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WYRE_PRIVILEGED_SIGN_COMMAND: '["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File","scripts/sign-windows-file.ps1","{file}"]'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets using the private key paired with plugins.updater.pubkey.' }
          $modulePath = $env:PSModulePath
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          try {
            pnpm tauri:build
            if ($LASTEXITCODE -ne 0) { throw "Tauri build failed with exit code $LASTEXITCODE" }
          } finally {
            $env:PSModulePath = $modulePath
          }
          New-Item -ItemType Directory -Force ..\release\windows | Out-Null
          $installers = Get-ChildItem target\release\bundle\nsis -Filter '*.exe'
          if (-not $installers) { throw 'Tauri did not produce a Windows NSIS installer.' }
          Copy-Item $installers.FullName ..\release\windows\
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ovren-signing.cer'
          Export-Certificate -Cert (Get-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT") -FilePath $certificatePath -Force | Out-Null
          Copy-Item $certificatePath ..\release\windows\Ovren-signing.cer
          foreach ($file in Get-ChildItem ..\release\windows -Filter '*.exe') {
            & pwsh.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/sign-windows-file.ps1 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Windows signing failed: $($file.Name)" }
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) { throw "Windows signature verification failed: $($file.Name)" }
            $version = '${{ needs.preflight.outputs.release_tag }}' -replace '^v', ''
            pnpm exec tauri signer sign --app-version $version $file.FullName
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$($file.FullName).sig")) { throw "Updater signature generation failed: $($file.Name)" }
          }
          Get-ChildItem ..\release\windows -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content ..\release\windows\SHA256SUMS-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ovren-windows
          path: release/

  linux:
    needs: [preflight]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: app
          cache-workspaces: app -> target
          cache-key: ubuntu-22.04
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/ovrennet/go.mod
      - name: Build Linux installers
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets using the private key paired with plugins.updater.pubkey.' >&2; exit 1; }
          pnpm tauri:build:linux
          mkdir -p ../release/linux
          cp target/release/bundle/appimage/*.AppImage ../release/linux/
          cp target/release/bundle/appimage/*.AppImage.sig ../release/linux/
          cp target/release/bundle/deb/*.deb ../release/linux/
          cd ../release/linux
          sha256sum *.AppImage *.deb > SHA256SUMS-Linux.txt
      - name: Sign Linux installers with the existing GPG key
        env:
          WYRE_GPG_PRIVATE_KEY: ${{ secrets.WYRE_GPG_PRIVATE_KEY }}
          WYRE_GPG_PASSPHRASE: ${{ secrets.WYRE_GPG_PASSPHRASE }}
          WYRE_GPG_KEY_ID: ${{ secrets.WYRE_GPG_KEY_ID }}
        run: |
          test -n "$WYRE_GPG_PRIVATE_KEY" && test -n "$WYRE_GPG_PASSPHRASE" && test -n "$WYRE_GPG_KEY_ID" || { echo 'Set WYRE_GPG_PRIVATE_KEY, WYRE_GPG_PASSPHRASE, and WYRE_GPG_KEY_ID in repository Actions secrets.' >&2; exit 1; }
          printf '%s' "$WYRE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-keys "$WYRE_GPG_KEY_ID" | grep -qi bxane || { echo 'The configured GPG signing key must identify bxane.' >&2; exit 1; }
          gpg --armor --export "$WYRE_GPG_KEY_ID" > release/linux/Ovren-signing-key.asc
          cd release/linux
          for file in *.AppImage *.deb SHA256SUMS-Linux.txt; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$WYRE_GPG_PASSPHRASE" --armor --detach-sign "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ovren-linux
          path: release/

  macos:
    needs: [preflight]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: app
          cache-workspaces: app -> target
          cache-key: macos-latest
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/ovrennet/go.mod
      - name: Build macOS disk image
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # shortcut: the app is not signed with an Apple Developer ID or notarized; add that when a certificate exists.
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets.' >&2; exit 1; }
          pnpm tauri:build:mac
          mkdir -p ../release/macos
          cp target/release/bundle/dmg/*.dmg ../release/macos/
          cp target/release/bundle/macos/*.app.tar.gz target/release/bundle/macos/*.app.tar.gz.sig ../release/macos/
          cd ../release/macos
          shasum -a 256 *.dmg *.app.tar.gz > SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ovren-macos
          path: release/

  publish:
    needs: [preflight, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create signed updater manifest
        run: node scripts/create-updater-manifest.mjs
      - name: Write one checksum file for every release asset
        # Hash files only, by the base name they get on the release page.
        run: |
          cp CHANGELOG.md release/
          cd release && find . -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum | sed -E 's#^([0-9a-f]+ [ *])\./(.*/)?#\1#' > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Ovren ${{ needs.preflight.outputs.release_tag }}
          files: |
            release/**
          body_path: CHANGELOG.md
      - name: Remove temporary release branch after publishing
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
